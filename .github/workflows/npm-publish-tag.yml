name: Publish to npm (on version tag)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC support
        run: |
          echo "Current npm version:"
          npm --version
          npm install -g npm@^11.21.0
          echo "Updated npm version:"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches git tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          GIT_TAG=${GITHUB_REF#refs/tags/v}
          echo "Package version: $PACKAGE_VERSION"
          echo "Git tag: $GIT_TAG"
          if [ "$PACKAGE_VERSION" != "$GIT_TAG" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match git tag ($GIT_TAG)"
            exit 1
          fi

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Build library
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -f "dist/index.js" ] || [ ! -f "dist/index.esm.js" ] || [ ! -f "dist/index.d.ts" ] || [ ! -f "dist/styles.css" ]; then
            echo "Error: Build output is incomplete"
            exit 1
          fi
          echo "Build output verified successfully"

      - name: Determine dist-tag
        id: disttag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MAJOR=${PACKAGE_VERSION%%.*}
          MINOR=$(echo "$PACKAGE_VERSION" | cut -d. -f2)
          # The current "latest" ("" if the package has never been published).
          LATEST=$(npm view @papernote/ui dist-tags.latest 2>/dev/null || echo "")
          LATEST_MAJOR=${LATEST%%.*}
          # newer A B: true when version A is greater than B.
          newer() { node -e 'const p=v=>v.split(/[.-]/).slice(0,3).map(Number);const a=p(process.argv[1]),b=p(process.argv[2]);for(let i=0;i<3;i++){if(a[i]!==b[i])process.exit(a[i]>b[i]?0:1)}process.exit(1)' "$1" "$2"; }
          if [ -z "$LATEST" ] || newer "$PACKAGE_VERSION" "$LATEST"; then
            TAG="latest"
          elif [ "$MAJOR" -lt "$LATEST_MAJOR" ]; then
            # A patch to an older major. It becomes legacy-vN only if it is the newest of that
            # major; a patch to an older minor line (1.10.x while legacy-v1 is 1.14.1) gets a
            # line tag instead, so legacy-v1 never moves backwards.
            LEGACY=$(npm view @papernote/ui "dist-tags.legacy-v${MAJOR}" 2>/dev/null || echo "")
            if [ -z "$LEGACY" ] || newer "$PACKAGE_VERSION" "$LEGACY"; then
              TAG="legacy-v${MAJOR}"
            else
              TAG="legacy-v${MAJOR}.${MINOR}"
            fi
          else
            # An older line of the current major (2.0.x while latest is 2.1.3): never "latest".
            TAG="legacy-v${MAJOR}.${MINOR}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using dist-tag: ${TAG}"

      - name: Stage for publishing
        # Staged, not published. The version goes public only when a maintainer approves it on
        # npm with 2FA: `npm stage list @papernote/ui`, then `npm stage approve <stage-id>`, or the
        # package's staged versions on npmjs.com. A tag push alone can no longer put a release in
        # front of users. Trusted publishing (OIDC) authenticates this step; there is no token.
        run: npm stage publish --access public --provenance --tag ${{ steps.disttag.outputs.tag }}

      - name: Awaiting approval
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=Approve @papernote/ui@${PACKAGE_VERSION}::Staged under dist-tag ${{ steps.disttag.outputs.tag }}. It is not public until approved on npm: npm stage list @papernote/ui, then npm stage approve <stage-id>."
